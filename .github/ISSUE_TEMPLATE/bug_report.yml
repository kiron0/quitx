name: Bug report
description: Something in QuitX doesn't work as expected
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open QuitX menu
        2. Click 'Quit All'
        3. …
  - type: input
    id: version
    attributes:
      label: QuitX version
      description: Shown in Settings → About
      placeholder: "1.2.0"
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and Mac
      placeholder: "macOS 15.1, MacBook Air M2"
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or logs
      description: Optional. Console.app messages starting with "QuitX:" are especially helpful.
