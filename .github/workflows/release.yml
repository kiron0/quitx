name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer || sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Build and Bundle App
        run: make bundle

      - name: Create DMG Installer
        run: |
          VERSION=${GITHUB_REF_NAME:-v1.0.0}
          echo "Packaging QuitX-${VERSION}.dmg..."
          DMG_STAGE=".build/dmg-staging"
          rm -rf "$DMG_STAGE"
          mkdir -p "$DMG_STAGE"
          cp -R .build/QuitX.app "$DMG_STAGE/"
          ln -s /Applications "$DMG_STAGE/Applications"
          hdiutil create -volname "QuitX" -srcfolder "$DMG_STAGE" -ov -format UDZO ".build/QuitX-${VERSION}.dmg"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: .build/QuitX-*.dmg
          draft: false
          prerelease: false
          generate_release_notes: true
