name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Build & Publish Release
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Resolve Version & Tag
        id: meta
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION=$(cat package.json | grep '"version"' | head -1 | awk -F: '{ print $2 }' | sed 's/[", ]//g')
            TAG="v$VERSION"
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"

            if git rev-parse "$TAG" >/dev/null 2>&1 || git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
              echo "Tag $TAG already exists. Bump package.json before a manual release." >&2
              exit 1
            fi
          else
            TAG="${GITHUB_REF_NAME:-v1.0.0}"
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
            echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          fi

          PACKAGE_VERSION=$(awk -F'"' '/"version"/ { print $4; exit }' package.json)
          if [ "${TAG#v}" != "$PACKAGE_VERSION" ]; then
            echo "Tag version ${TAG#v} does not match package.json version $PACKAGE_VERSION." >&2
            exit 1
          fi

      - name: Select Xcode Version
        run: |
          XCODE_APP=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$XCODE_APP" ]; then
            XCODE_APP="/Applications/Xcode.app"
          fi
          echo "Selected: $XCODE_APP"
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"

      - name: Run Tests
        run: swift test

      - name: Build and Bundle App
        run: make bundle

      - name: Create DMG Installer
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          echo "Packaging QuitX-${TAG}.dmg..."
          DMG_STAGE=".build/dmg-staging"
          rm -rf "$DMG_STAGE"
          mkdir -p "$DMG_STAGE"
          cp -R .build/QuitX.app "$DMG_STAGE/"
          ln -s /Applications "$DMG_STAGE/Applications"
          hdiutil create -volname "QuitX" -srcfolder "$DMG_STAGE" -ov -format UDZO ".build/QuitX-${TAG}.dmg"

      - name: Create Tag for Manual Release
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "$TAG"
          git push origin "refs/tags/$TAG"

      - name: Write release notes
        shell: bash
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          awk -v version="$VERSION" '
            $0 == "## " version { found=1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > release-changes.md || true

          cat > release-notes.md <<EOF
          ## What's Changed

          EOF

          if [ -s release-changes.md ]; then
            cat release-changes.md >> release-notes.md
          else
            echo "See commit history for changes included in this version." >> release-notes.md
          fi

          cat >> release-notes.md <<EOF

          ## Install

          1. Download \`QuitX-${{ steps.meta.outputs.tag }}.dmg\` from Assets below.
          2. Open the disk image and drag **QuitX** to your \`/Applications\` folder.

          **Full changelog:** https://github.com/${{ github.repository }}/commits/${{ steps.meta.outputs.tag }}
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.tag }}
          body_path: release-notes.md
          files: .build/QuitX-*.dmg
          draft: false
          prerelease: false
