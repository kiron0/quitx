name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build & Test (macOS 14)
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer || sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Show Environment
        run: |
          swift --version
          uname -a

      - name: Run Tests
        run: swift test --build-system native

      - name: Build Release Binary
        run: swift build -c release --build-system native

      - name: Package .app Bundle
        run: make bundle
