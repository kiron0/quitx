<!doctype html>
<html class="pg-shots m-0 overflow-hidden w-[1440px] h-[900px] bg-[#0B0A09]" lang="en">
  <head>
    <meta charset="utf-8" />
    <title>QuitX product shots</title>
    <link rel="stylesheet" href="fonts.css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.3"></script>
    <style type="text/tailwindcss">
      @theme {
        --color-gold: #febc33;
        --color-ink: #f5f2ec;
        --color-muted: rgba(245, 242, 236, 0.62);
      }
      @layer base {
        :root {
          --qx-gold: #FEBC33;
          --qx-gold-deep: #E89B00;

  </head>
  <body class="m-0 overflow-hidden w-[1440px] h-[900px] bg-[#0B0A09] font-['Inter',system-ui,sans-serif] text-[var(--color-ink)] antialiased leading-[normal]">
    <script src="kit.js"></script>
    <div id="root"></div>
    <script>
      const A = "../site/assets/";
      const S = QX.S;
      const mb = (o = {}) =>
        `<div class="menubar py-0 px-[18px] gap-[20px] absolute left-0 right-0 top-0 h-[28px] z-[5] flex items-center bg-[rgba(18,14,10,.38)] [backdrop-filter:blur(30px)_saturate(1.4)] text-[13px] font-[var(--font-weight-medium)] text-[rgba(255,255,255,.92)]"><b class="font-bold">Finder</b><span>File</span><span>Edit</span><span>View</span><span>Go</span><span>Window</span><span>Help</span><div class="right ml-auto gap-[14px] flex items-center">${o.stats ? `<span id="statsItem">${QX.stats(o.stats)}</span>` : ""}<div class="qx place-items-center relative w-[28px] h-[22px] rounded-[5px] grid [&.active]:bg-[rgba(255,255,255,.22)]" id="qx"><img class="w-[17px] h-[17px] [filter:invert(1)]" src="${A}status-icon.png" alt="">${o.dot ? '<span class="dot absolute right-[2px] top-[1px] w-[7px] h-[7px] rounded-full bg-[#FF453A] shadow-[0_0_0_1px_rgba(20,14,10,0.6)]"></span>' : ""}</div>${o.stats ? "" : '<svg class="block" width="24" height="12" viewBox="0 0 22 12">' + S.batt.replace(/<\/?svg[^>]*>/g, "") + "</svg>"}<svg class="block" width="17" height="13" viewBox="0 0 18 14"><path d="M9 12.6l2.2-2.4a3.2 3.2 0 0 0-4.4 0zM4.6 8.1a6.2 6.2 0 0 1 8.8 0l1.4-1.5a8.3 8.3 0 0 0-11.6 0zM1.6 4.9a10.6 10.6 0 0 1 14.8 0L17.8 3.4A12.7 12.7 0 0 0 .2 3.4z" fill="#fff"/></svg><span>Fri Oct 23&nbsp;&nbsp;9:41 AM</span></div></div>`;
      const copy = (eyebrow, h, p, chips = []) =>
        `<div class="copy absolute top-[50%] left-[104px] w-[560px] [transform:translateY(-50%)] z-[3]"><div class="eyebrow gap-[10px] inline-flex items-center tracking-[.08em] text-[var(--color-gold)] uppercase font-semibold text-[13px] leading-[1] font-['Inter']"><img class="w-[26px] h-[26px]" src="${A}icon.png" alt="">${eyebrow}</div><h1 class="mx-0 mt-[22px] mb-[18px] text-[58px] font-bold tracking-[-.035em] font-['Inter_Display','Inter',sans-serif] leading-[1.03]">${h}</h1><p class="m-0 text-[19px] leading-[1.55] text-[var(--color-muted)]">${p}</p>${chips.length ? `<div class="chips mt-[30px] gap-[10px] flex flex-wrap">${chips.map((c) => `<span class="chip py-[9px] px-[14px] gap-[8px] inline-flex items-center rounded-[999px] bg-[rgba(255,255,255,.07)] text-[14px] font-[var(--font-weight-medium)] text-[rgba(255,255,255,.85)] shadow-[inset_0_0_0_1px_rgba(255,255,255,0.1)]">${c}</span>`).join("")}</div>` : ""}</div>`;
      const most = QX.APPS.filter(
        (a) => !["Reminders", "Podcasts", "Books"].includes(a.n),
      );

      const SCENES = {
        hero: () => ({
          mb: {},
          copy: copy(
            "QuitX for macOS",
            "Quit everything.<br><span class='text-[var(--color-gold)]'>Keep what matters.</span>",
            "Every running app in one menu bar list, grouped with its windows and helpers. Quit one, some, or all of them in a click.",
            [
              "Free &amp; open source",
              "macOS 14 or later",
              "No account, no tracking",
            ],
          ),
          ui: [
            { anchor: "qx", html: QX.popover({ hover: "Music" }), zoom: 1.6 },
          ],
        }),
        force: () => ({
          mb: {},
          copy: copy(
            "Normal quit or force quit",
            "Stuck app?<br><span class='text-[var(--color-gold)]'>Hold Option.</span>",
            "Quit asks apps nicely, so they can save your work. Hold ⌥ and every button turns into Force Quit. Or make Force Quit the default in Settings.",
            ["<kbd class='py-[4px] px-[7px] font-semibold text-[12px] leading-[1] font-[&#39;Inter&#39;] rounded-[6px] bg-[rgba(255,255,255,.12)]'>⌥</kbd> Force quit on demand", "Default: Normal or Force"],
          ),
          ui: [
            {
              anchor: "qx",
              html: QX.popover({ force: true, hover: "Music" }),
              zoom: 1.6,
            },
          ],
        }),
        confirm: () => ({
          mb: {},
          copy: copy(
            "Confirm before quit",
            "One click.<br><span class='text-[var(--color-gold)]'>No accidents.</span>",
            "A quick confirmation before Quit All, and optionally before single quits and restarts. Escape cancels, Return confirms.",
            ["Quit All confirmation", "Single-app confirmation"],
          ),
          ui: [
            {
              anchor: "qx",
              html: QX.popover({
                unselected: ["Music"],
                overlay: QX.confirm({ count: 14, all: false }),
              }),
              zoom: 1.6,
            },
          ],
        }),
        background: () => ({
          mb: {},
          copy: copy(
            "Background apps",
            "See what’s<br><span class='text-[var(--color-gold)]'>hiding.</span>",
            "Show helpers and agents that never appear in the Dock, grouped so 40 identical processes take one row. Toggle with ⌘B.",
            ["View Background Apps", "Grouped instances"],
          ),
          ui: [
            {
              anchor: "qx",
              html: QX.popover({
                apps: [
                  QX.APPS[1],
                  QX.BACKGROUND[0],
                  QX.BACKGROUND[1],
                  QX.APPS[3],
                  QX.BACKGROUND[2],
                ],
                gearOn: true,
                hl: "Docker Desktop",
                footer: "Quit one, some, or all apps",

              zoom: 1.6,
            },
            {
              below: "gear",
              html: QX.menu([
                { t: "Refresh Apps", icon: "refresh", k: "⌘R" },
                {

                  icon: "eyeOff",

                { t: "Reopen Recently Quit", icon: "undo", chev: true },

                { t: "What's New", icon: "sparkles", k: "⌘N" },

                { t: "Quit QuitX", icon: "quit", k: "⌘Q" },

        exclude: () => ({
          mb: {},
          copy: copy(
            "Exclude apps",
            "Some apps<br><span class='text-[var(--color-gold)]'>never quit.</span>",
            "Add an app from its ••• menu and it stays out of every manual and automatic quit. Music apps can be protected with one switch.",

          ui: [
            {
              anchor: "qx",
              html: QX.popover({ hover: "Music", moreOn: "Music" }),

            {
              beside: "Music",
              html: QX.menu([
                { t: "Quit", icon: "quit", k: "⌘Q" },
                { t: "Force Quit", icon: "boltLine", k: "⌥⌘Q" },
                { t: "Restart", icon: "restart", k: "⌘R" },

                { t: "Quit In", icon: "alarm", chev: true },

        stats: () => ({

              x: 560,

              zoom: 2,
              html: `<div class="py-[5px] px-[10px] gap-[6px] flex items-center rounded-[12px] bg-[rgba(18,14,10,.55)] [backdrop-filter:blur(20px)] shadow-[inset_0_0_0_.5px_rgba(255,255,255,.2),0_12px_30px_rgba(0,0,0,.4)]">${QX.stats({ cpu: "12%", mem: "9.4 GB", gpu: "8%", bat: "82%", clean: "5.1 GB" })}<span class="w-[22px] h-[20px] grid place-items-center"><img src="${A}status-icon.png" class="w-[15px] h-[15px] invert" alt=""></span></div>`,
            },
          ],
          ring: "statsItem",
        }),
        health: () => ({
          mb: {},
          copy: copy(
            "Health alerts",
            "Too hot?<br><span class='text-[var(--color-gold)]'>You get a heads-up.</span>",

          ),
          ui: [
            {
              anchor: "qx",
              html: QX.rescue({
                title: "High CPU usage",

                targets: [
                  { n: "Google Chrome", i: "chrome", v: "48%" },
                  { n: "Docker Desktop", v: "21%" },
                  { n: "Visual Studio Code", i: "vscode", v: "17%" },
                ],
              }),
              zoom: 1.6,
            },
          ],
        }),
        sleep: () => ({
          mb: {},
          copy: copy(
            "Quit after sleep",
            "Wake up to<br><span class='text-[var(--color-gold)]'>a clean slate.</span>",
            "When your Mac wakes after sleeping through the hours you choose, QuitX quits the apps left open. Daytime naps leave everything as it was.",
            ["12 AM to 6 AM by default", "12 or 24-hour clock"],
          ),
          ui: [
            {
              x: 680,
              y: 110,
              zoom: 1.1,
              html: QX.settings({
                tab: "Automation",

            },

        theme: () => ({
          mb: {},
          copy: copy(
            "Classic or Liquid Glass",

            "Pick the solid classic look or translucent Liquid Glass on macOS 26. Every window and menu follows along.",

          ),
          ui: [
            {
              x: 690,
              y: 160,
              html: QX.popover({ apps: most.slice(0, 9), hover: "Music" }),
              zoom: 1.05,
              label: "Classic",
            },
            {
              x: 1066,
              y: 160,
              html: QX.popover({
                apps: most.slice(0, 9),
                hover: "Music",
                glass: true,
              }),
              zoom: 1.05,
              label: "Liquid Glass",
            },
          ],
        }),
        sounds: () => ({
          mb: {},
          copy: copy(
            "Sounds",
            "Pew pew.<br><span class='text-[var(--color-gold)]'>Gone.</span>",
            "A short arcade laser plays every time you vaporize an app. Love it or switch it off in Settings.",
            ["Play cool sounds", "On by default"],
          ),
          ui: [
            {
              x: 680,
              y: 110,
              zoom: 1.1,
              html: QX.settings({
                tab: "General",
                content: QX.general({ hl: "sounds" }),
              }),
            },
            {
              x: 950,
              y: 650,
              html: `<div class="wave gap-[5px] flex items-center h-[80px]">${[18, 34, 56, 74, 48, 66, 40, 58, 30, 46, 24, 36, 16, 26, 12].map((h) => `<i class="w-[6px] h-[${h}px] rounded-[3px] bg-[linear-gradient(#ffd271,#e89b00)]"></i>`).join("")}</div>`,
            },
          ],
        }),
        updates: () => ({
          mb: { dot: true },
          copy: copy(
            "In-app updates",
            "Updates itself,<br><span class='text-[var(--color-gold)]'>straight from GitHub.</span>",
            "A red dot tells you a new version shipped. QuitX downloads it from GitHub Releases, checks the checksum and code signature, then swaps itself in place.",
            ["No update server", "Signature verified", "Settings carry over"],
          ),
          ui: [
            {
              anchor: "qx",
              menu: true,
              html: QX.menu([
                { t: "Restart to Update to v1.2.3", dot: true, on: true },
                "-",
                { t: "Uninstall Apps", icon: "trash" },
                "-",
                { t: "Settings", icon: "settings", k: "⌘," },
                { t: "Help", icon: "help", k: "⌘?" },
                { t: "What's New", icon: "sparkles", k: "⌘N" },
                { t: "Check for Updates", icon: "refresh", k: "⌘U" },
                { t: "About QuitX", icon: "info", k: "⌘I" },
                "-",
                { t: "Quit QuitX", icon: "quit", k: "⌘Q" },
              ]),
              zoom: 1.15,
            },
            {
              x: 770,
              y: 300,
              html: `<div class="qx-win py-0 pr-[22px] pb-[18px] pl-[22px] overflow-hidden w-[412px] rounded-[12px] bg-[#2A292C] text-[#EDEBE7] font-['Inter',-apple-system,system-ui,sans-serif] shadow-[0_0_0_.5px_rgba(255,255,255,.14),0_0_0_1px_rgba(0,0,0,.6),0_36px_72px_rgba(0,0,0,.5),0_6px_18px_rgba(0,0,0,.3)]"><div class="h-[34px] flex items-center justify-center relative text-[13px] font-semibold text-[rgba(255,255,255,.88)]"><span class="lights gap-[8px] flex absolute left-[-8px]"><i class="w-[12px] h-[12px] rounded-[50%] block bg-[#FF5F57] shadow-[inset_0_0_0_.5px_rgba(0,0,0,.25)]"></i><i class="w-[12px] h-[12px] rounded-[50%] block bg-[#58565A] shadow-[inset_0_0_0_.5px_rgba(0,0,0,.25)]"></i><i class="w-[12px] h-[12px] rounded-[50%] block bg-[#58565A] shadow-[inset_0_0_0_.5px_rgba(0,0,0,.25)]"></i></span>Update</div><div class="mt-[10px] gap-[16px] flex items-start"><div class="relative flex-none"><img src="${A}icon.png" class="w-[64px] h-[64px] block" alt=""><span class="absolute right-[3px] bottom-[3px] w-[22px] h-[22px] rounded-full bg-[#30D158] grid place-items-center shadow-[0_0_0_2px_#2A292C]"><svg width="12" height="12" viewBox="0 0 12 12"><path d="M2.4 6.3l2.3 2.3L9.8 3.4" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span></div><div><div class="mt-[2px] mx-0 mb-[6px] text-[15px] font-bold">Ready to Install v1.2.3</div><div class="text-[12.5px] text-[rgba(255,255,255,.8)] leading-[1.45]">The latest version has been downloaded and verified.</div><div class="mt-[4px] text-[12px] text-[rgba(255,255,255,.52)]">QuitX will restart to finish installing the update.</div></div></div><div class="mt-[20px] gap-[8px] flex justify-end"><span class="py-0 px-[15px] h-[30px] rounded-[7px] inline-flex items-center text-[13px] font-medium bg-[rgba(255,255,255,.1)]">Later</span><span class="py-0 px-[15px] h-[30px] rounded-[7px] inline-flex items-center text-[13px] font-semibold bg-[#FEBC33] text-[rgba(0,0,0,.88)]">Restart &amp; Update</span></div></div>`,
            },
          ],
        }),
        ports: () => ({
          mb: { stats: { ports: 6, cpu: "12%", mem: "9.4 GB" } },
          copy: copy(
            "Port killing",
            "Port in use?<br><span class='text-[var(--color-gold)]'>Free it in a click.</span>",
            "Turn on Ports in Settings and every listening port shows up next to your apps: dev servers, databases and Docker containers. Kill one, some, or all, with the process tree behind it.",
            ["Live refresh", "Docker aware", "SIGTERM, then SIGKILL"],
          ),
          ui: [
            {
              anchor: "qx",
              w: 330,
              html: QX.ports({ selected: [3000, 5173], hover: 3000 }),
              zoom: 1.6,
            },
          ],
          ring: "statsItem",
        }),
        quickclean: () => ({
          mb: { stats: { cpu: "12%", mem: "9.4 GB", bat: "82%", clean: "5.1 GB" } },
          copy: copy(
            "Quick Clean",
            "Caches piling up?<br><span class='text-[var(--color-gold)]'>Clean in two clicks.</span>",
            "Turn on the Cleanup stat to see reclaimable space in the menu bar. Click it, tick what to clear, and confirm. Safe caches are ticked for you; Trash waits for your say-so.",
            ["Safe or Caution labels", "Confirm before delete", "Rescans on your schedule"],
          ),
          ui: [
            {
              anchor: "stat",
              seg: "clean",
              w: 330,
              html: QX.statsDetail({ mode: "cleanup" }),
              zoom: 1.5,
            },
          ],
          ring: "statsItem",
        }),
        uninstall: () => ({
          mb: {},
          copy: copy(
            "Uninstall apps",
            "Remove apps<br><span class='text-[var(--color-gold)]'>and what they leave.</span>",
            "Pick apps in Settings and review every support file, cache, preference and log before they go. Leftovers finds files from apps you already deleted.",
            ["Review before removal", "Leftovers scanner", "Never touches Apple apps"],
          ),
          ui: [
            {
              x: 680,
              y: 150,
              zoom: 1.1,
              html: QX.settings({
                tab: "Uninstall Apps",
                right: QX.scanHead("2.71 GB", "5 apps"),
                content: QX.uninstallTab({ selected: ["Discord", "Google Chrome"], selectedSize: "1.72 GB" }),
              }),
            },
          ],
        }),
        cleanup: () => ({
          mb: {},
          copy: copy(
            "Cleanup",
            "Review first,<br><span class='text-[var(--color-gold)]'>then reclaim space.</span>",
            "System Junk, User Cache, Mail Files, Trash, Large & Old Files, AI apps, Xcode, Homebrew, Node and Docker caches, each on its own page. Search, filter, sort, and nothing is deleted without a confirmation.",
            ["10 cleanup pages", "Search & filter", "Confirm before delete"],
          ),
          ui: [
            {
              x: 680,
              y: 150,
              zoom: 1.1,
              html: QX.settings({
                tab: "User Cache",
                right: QX.scanHead("3.01 GB", "5 items"),
                content: QX.filesTab({ items: QX.CACHES, selectedSize: "3.01 GB" }),
              }),
            },
          ],
        }),
        portsSettings: () => ({
          mb: { stats: { ports: 6, cpu: "12%", mem: "9.4 GB" } },
          copy: copy(
            "Ports settings",
            "Off until<br><span class='text-[var(--color-gold)]'>you want it.</span>",
            "Port killing stays off until you switch it on. Then pick how often the list refreshes, group listeners, and exclude ports that must never be touched.",
            ["Off by default", "Exclude ports", "Confirm before kill"],
          ),
          ui: [
            {
              x: 680,
              y: 150,
              zoom: 1.1,
              html: QX.settings({
                tab: "Ports",
                content: QX.portSettings({ hl: "enable" }),
              }),
            },
          ],
          ring: "statsItem",
        }),
      };

      const hash = (location.hash || "#hero").slice(1);
      const bare = hash.endsWith("-bare");
      const id = hash.replace("-bare", "");
      const twSettle = async () => {
        let last = "";
        for (let i = 0; i < 120; i++) {
          await new Promise((r) => requestAnimationFrame(r));
          const now = [...document.querySelectorAll("style:not([type])")]
            .map((s) => s.textContent.length)
            .join();
          if (i > 1 && now === last) return;
          last = now;
        }
      };
      const build = () => {
        const sc = SCENES[id]();
        const root = document.getElementById("root");
        root.innerHTML = `<div class="wall inset-0 absolute bg-[radial-gradient(60%_75%_at_82%_8%,rgba(254,188,51,0.55),transparent_62%),radial-gradient(55%_65%_at_100%_100%,rgba(214,92,26,0.55),transparent_60%),radial-gradient(70%_80%_at_0%_100%,rgba(70,38,14,0.9),transparent_65%),linear-gradient(160deg,#1a1511_0%,#120f0c_45%,#24160c_100%)]"></div>${mb(sc.mb)}${bare ? "" : sc.copy}`;
        const qx = document.getElementById("qx");
        const qr = qx.getBoundingClientRect();
        const cx = qr.left + qr.width / 2;
        for (const u of sc.ui) {
          const el = document.createElement("div");
          el.className = "ui absolute z-[4]";
          el.innerHTML = u.html;
          if (u.zoom) el.style.zoom = u.zoom;
          root.appendChild(el);
          const z = u.zoom || 1;
          if (u.anchor === "stat") {
            const seg = document.querySelector(`#statsItem [data-k="${u.seg}"]`).getBoundingClientRect();
            const sx = seg.left + seg.width / 2;
            const pw = u.w || 270;
            const left = Math.min(sx - (pw / 2) * z, 1440 - pw * z - 8);
            const arrow = el.querySelector(".arrow");
            if (arrow) arrow.style.left = (sx - left) / z + "px";
            el.style.left = left / z + "px";
            el.style.top = (seg.bottom + 4) / z + "px";
          } else if (u.anchor === "qx" && !u.menu) {
            qx.classList.add("active");
            const pw = u.w || 330;
            const left = Math.min(cx - (pw / 2) * z, 1440 - pw * z - 8);
            const arrow = el.querySelector(".arrow");
            if (arrow) arrow.style.left = (cx - left) / z + "px";
            el.style.left = left / z + "px";
            el.style.top = (qr.bottom + 1) / z + "px";
          } else if (u.anchor === "qx" && u.menu) {
            qx.classList.add("active");
            el.style.left = Math.min(qr.left - 4, 1440 - 250 * z - 10) / z + "px";
            el.style.top = (qr.bottom + 4) / z + "px";
          } else if (u.below === "gear") {
            const g = document
              .querySelector('[data-role="gear"]')
              .getBoundingClientRect();
            el.style.left = (g.left - 8) / z + "px";
            el.style.top = (g.bottom + 4) / z + "px";
            const mh = el.getBoundingClientRect().height;
            if (g.bottom + 4 + mh > 892)
              el.style.top = (g.top - 4 - mh) / z + "px";
            if (g.left - 8 + 236 * z > 1430)
              el.style.left = (1430 - 236 * z) / z + "px";
          } else if (u.besidePort) {
            const rr = document
              .querySelector(`[data-port="${u.besidePort}"] .more`)
              .getBoundingClientRect();
            el.querySelector(".qx-menu").style.width = (u.w || 236) + "px";
            const w = (u.w || 236) * z;
            el.style.left = (rr.left - w - 6) / z + "px";
            el.style.top = (rr.top - 4) / z + "px";
          } else if (u.beside) {
            const rr = document
              .querySelector(`[data-app="${u.beside}"] .more`)
              .getBoundingClientRect();
            const w = 236 * z;
            let left = rr.left - w - 6;
            el.style.left = left / z + "px";
            el.style.top = (rr.top - 4) / z + "px";
          } else {
            el.style.left = u.x / z + "px";
            el.style.top = u.y / z + "px";
          }
          if (u.label && !bare) {
            const r = el.getBoundingClientRect();
            root.insertAdjacentHTML(
              "beforeend",
              `<div class="label absolute left-[${r.left}px] top-[${r.top - 26}px] tracking-[.08em] uppercase font-semibold text-[13px] leading-[1] font-['Inter'] text-[rgba(255,255,255,.75)]">${u.label}</div>`,
            );
          }
        }
        if (sc.ring)
          document
            .getElementById(sc.ring)
            .firstElementChild.classList.add("active");
        const FOCUS = {
          force: ['[data-role="quit"]', '[data-app="Maps"]'],
          confirm: [".qx-confirm"],
          background: ['[data-app="Docker Desktop"]', ".qx-menu"],
          exclude: [".qx-menu", '[data-app="Music"] .pw'],
          hero: ['[data-role="quit"]', '[data-app="Messages"]'],
          ports: [".qx-pop"],
        };
        window.FOCUS_RECT = (() => {
          const sels = FOCUS[id];
          if (!sels) return null;
          let x0 = 1e9,
            y0 = 1e9,
            x1 = -1e9,
            y1 = -1e9;
          sels.forEach((sel) =>
            document.querySelectorAll(sel).forEach((el) => {
              const r = el.getBoundingClientRect();
              x0 = Math.min(x0, r.left);
              y0 = Math.min(y0, r.top);
              x1 = Math.max(x1, r.right);
              y1 = Math.max(y1, r.bottom);
            }),
          );
          return { x0, y0, x1, y1 };
        })();
        window.UI_RECT = (() => {
          let x0 = 1e9,
            y0 = 1e9,
            x1 = -1e9,
            y1 = -1e9;
          document.querySelectorAll(".ui").forEach((el) => {
            const r = el.getBoundingClientRect();
            x0 = Math.min(x0, r.left);
            y0 = Math.min(y0, r.top);
            x1 = Math.max(x1, r.right);
            y1 = Math.max(y1, r.bottom);
          });
          return { x0, y0, x1, y1 };
        })();
      };
      build();
      twSettle().then(() => {
        build();
        window.SHOT_READY = true;
      });
    </script>
  </body>
</html>
