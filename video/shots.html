<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>QuitX product shots</title>
<link rel="stylesheet" href="kit.css">
<style>
  :root { --gold: #FEBC33; --ink: #F5F2EC; --muted: rgba(245, 242, 236, .62); }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1440px; height: 900px; overflow: hidden; background: #0B0A09; }
  body { font-family: "Inter", system-ui, sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; }
  .wall { position: absolute; inset: 0;
    background:
      radial-gradient(60% 75% at 82% 8%, rgba(254, 188, 51, .55), transparent 62%),
      radial-gradient(55% 65% at 100% 100%, rgba(214, 92, 26, .55), transparent 60%),
      radial-gradient(70% 80% at 0% 100%, rgba(70, 38, 14, .9), transparent 65%),
      linear-gradient(160deg, #1A1511 0%, #120F0C 45%, #24160C 100%); }
  .menubar { position: absolute; left: 0; right: 0; top: 0; height: 28px; z-index: 5; display: flex; align-items: center; gap: 20px; padding: 0 18px;
    background: rgba(18, 14, 10, .38); backdrop-filter: blur(30px) saturate(1.4); font-size: 13px; font-weight: 500; color: rgba(255,255,255,.92); }
  .menubar b { font-weight: 700; }
  .menubar .right { margin-left: auto; display: flex; align-items: center; gap: 14px; }
  .menubar svg { display: block; }
  .qx { position: relative; width: 28px; height: 22px; border-radius: 5px; display: grid; place-items: center; }
  .qx.active, .qx-stats.active { background: rgba(255,255,255,.22); }
  .qx img { width: 17px; height: 17px; filter: invert(1); }
  .qx .dot { position: absolute; right: 2px; top: 1px; width: 7px; height: 7px; border-radius: 50%; background: #FF453A; box-shadow: 0 0 0 1px rgba(20,14,10,.6); }
  .copy { position: absolute; left: 104px; top: 50%; transform: translateY(-50%); width: 560px; z-index: 3; }
  .eyebrow { display: inline-flex; align-items: center; gap: 10px; font: 600 13px/1 "Inter"; letter-spacing: .08em; text-transform: uppercase; color: var(--gold); }
  .eyebrow img { width: 26px; height: 26px; }
  h1 { margin: 22px 0 18px; font-family: "Inter Display", "Inter", sans-serif; font-weight: 700; font-size: 58px; line-height: 1.03; letter-spacing: -.035em; }
  h1 span { color: var(--gold); }
  .copy p { margin: 0; font-size: 19px; line-height: 1.55; color: var(--muted); }
  .chips { display: flex; gap: 10px; margin-top: 30px; flex-wrap: wrap; }
  .chip { display: inline-flex; align-items: center; gap: 8px; padding: 9px 14px; border-radius: 999px; background: rgba(255,255,255,.07); box-shadow: inset 0 0 0 1px rgba(255,255,255,.1); font-size: 14px; font-weight: 500; color: rgba(255,255,255,.85); }
  .chip kbd { font: 600 12px/1 "Inter"; padding: 4px 7px; border-radius: 6px; background: rgba(255,255,255,.12); }
  .ui { position: absolute; z-index: 4; }
  .z { zoom: 1.6; }
  .z14 { zoom: 1.4; }
  .label { position: absolute; font: 600 13px/1 "Inter"; letter-spacing: .08em; text-transform: uppercase; color: rgba(255,255,255,.75); }
  .keycap { display: inline-grid; place-items: center; min-width: 60px; height: 60px; padding: 0 16px; border-radius: 14px; font: 600 26px/1 "Inter"; color: #fff;
    background: linear-gradient(#3A383B, #2A292B); box-shadow: inset 0 1px 0 rgba(255,255,255,.12), 0 3px 0 #151415, 0 10px 22px rgba(0,0,0,.35); }
  .wave { display: flex; align-items: center; gap: 5px; height: 80px; }
  .wave i { width: 6px; border-radius: 3px; background: linear-gradient(#FFD271, #E89B00); }
</style>
</head>
<body>
<script src="kit.js"></script>
<div id="root"></div>
<script>
  const A = '../site/assets/';
  const S = QX.S;
  const mb = (o = {}) => `<div class="menubar"><b>Finder</b><span>File</span><span>Edit</span><span>View</span><span>Go</span><span>Window</span><span>Help</span><div class="right">${o.stats ? `<span id="statsItem">${QX.stats(o.stats)}</span>` : ''}<div class="qx" id="qx"><img src="${A}status-icon.png" alt="">${o.dot ? '<span class="dot"></span>' : ''}</div>${o.stats ? '' : '<svg width="24" height="12" viewBox="0 0 22 12">' + S.batt.replace(/<\/?svg[^>]*>/g, '') + '</svg>'}<svg width="17" height="13" viewBox="0 0 18 14"><path d="M9 12.6l2.2-2.4a3.2 3.2 0 0 0-4.4 0zM4.6 8.1a6.2 6.2 0 0 1 8.8 0l1.4-1.5a8.3 8.3 0 0 0-11.6 0zM1.6 4.9a10.6 10.6 0 0 1 14.8 0L17.8 3.4A12.7 12.7 0 0 0 .2 3.4z" fill="#fff"/></svg><span>Fri Oct 23&nbsp;&nbsp;9:41 AM</span></div></div>`;
  const copy = (eyebrow, h, p, chips = []) => `<div class="copy"><div class="eyebrow"><img src="${A}icon.png" alt="">${eyebrow}</div><h1>${h}</h1><p>${p}</p>${chips.length ? `<div class="chips">${chips.map(c => `<span class="chip">${c}</span>`).join('')}</div>` : ''}</div>`;
  const most = QX.APPS.filter(a => !['Reminders', 'Podcasts', 'Books'].includes(a.n));

  const SCENES = {
    hero: () => ({
      mb: {},
      copy: copy('QuitX for macOS', 'Quit everything.<br><span>Keep what matters.</span>', 'Every running app in one menu bar list, grouped with its windows and helpers. Quit one, some, or all of them in a click.', ['Free &amp; open source', 'macOS 14 or later', 'No account, no tracking']),
      ui: [{ anchor: 'qx', html: QX.popover({ hover: 'Music' }), zoom: 1.6 }],
    }),
    force: () => ({
      mb: {},
      copy: copy('Normal quit or force quit', 'Stuck app?<br><span>Hold Option.</span>', 'Quit asks apps nicely, so they can save your work. Hold ⌥ and every button turns into Force Quit. Or make Force Quit the default in Settings.', ['<kbd>⌥</kbd> Force quit on demand', 'Default: Normal or Force']),
      ui: [{ anchor: 'qx', html: QX.popover({ force: true, hover: 'Music' }), zoom: 1.6 }],
    }),
    confirm: () => ({
      mb: {},
      copy: copy('Confirm before quit', 'One click.<br><span>No accidents.</span>', 'A quick confirmation before Quit All, and optionally before single quits and restarts. Escape cancels, Return confirms.', ['Quit All confirmation', 'Single-app confirmation']),
      ui: [{ anchor: 'qx', html: QX.popover({ unselected: ['Music'], overlay: QX.confirm({ count: 14, all: false }) }), zoom: 1.6 }],
    }),
    background: () => ({
      mb: {},
      copy: copy('Background apps', 'See what’s<br><span>hiding.</span>', 'Show helpers and agents that never appear in the Dock, grouped so 40 identical processes take one row. Toggle with ⌘B.', ['View Background Apps', 'Grouped instances']),
      ui: [
        { anchor: 'qx', html: QX.popover({ apps: [...QX.APPS.slice(0, 3), QX.BACKGROUND[0], QX.BACKGROUND[1], ...QX.APPS.slice(3, 4), QX.BACKGROUND[2], ...QX.APPS.slice(4, 6)], gearOn: true, hl: 'Docker Desktop', footer: 'Quit one, some, or all apps' }), zoom: 1.6 },
        { below: 'gear', html: QX.menu([{ t: 'Refresh Apps', icon: 'refresh', k: '⌘R' }, { t: 'Hide Background Apps', icon: 'eyeOff', k: '⌘B', on: true }, { t: 'Reopen Recently Quit', icon: 'undo', chev: true }, '-', { t: 'Settings', icon: 'settings', k: '⌘,' }, { t: 'Help', icon: 'help', k: '⌘?' }, { t: 'Quit', icon: 'quit', k: '⌘Q' }]), zoom: 1.4 },
      ],
    }),
    exclude: () => ({
      mb: {},
      copy: copy('Exclude apps', 'Some apps<br><span>never quit.</span>', 'Add an app from its ••• menu and it stays out of every manual and automatic quit. Music apps can be protected with one switch.', ['Add to Exclude List', 'Never quit music apps']),
      ui: [
        { anchor: 'qx', html: QX.popover({ hover: 'Music', moreOn: 'Music' }), zoom: 1.6 },
        { beside: 'Music', html: QX.menu([{ t: 'Quit', icon: 'quit', k: '⌘Q' }, { t: 'Force Quit', icon: 'boltLine', k: '⌥⌘Q' }, { t: 'Restart', icon: 'restart', k: '⌘R' }, { t: 'Quit In', icon: 'timer', chev: true }, { t: 'Quit Other Apps', icon: 'others' }, '-', { t: 'Add to Exclude List', icon: 'nosign', k: '⌘E', on: true }, { t: 'Reveal in Finder', icon: 'finder', k: '⌘F' }]), zoom: 1.4 },
      ],
    }),
    stats: () => ({
      mb: { stats: { cpu: '12%', mem: '9.4 GB', gpu: '8%', bat: '82%' } },
      copy: copy('Menu bar stats', 'Your Mac’s vitals,<br><span>always in view.</span>', 'Live CPU, memory, GPU and battery right in the menu bar. Show any mix, as icons or text, and click a stat for a detailed view.', ['CPU', 'Memory', 'GPU', 'Battery']),
      ui: [
        { x: 680, y: 210, zoom: 1.1, html: QX.settings({ tab: 'General', content: QX.general({ hl: 'stats' }) }) },
        { x: 700, y: 92, zoom: 2, html: `<div style="display:flex;align-items:center;gap:6px;padding:5px 10px;border-radius:12px;background:rgba(18,14,10,.55);backdrop-filter:blur(20px);box-shadow:inset 0 0 0 .5px rgba(255,255,255,.2),0 12px 30px rgba(0,0,0,.4)">${QX.stats({ cpu: '12%', mem: '9.4 GB', gpu: '8%', bat: '82%' })}<span style="width:22px;height:20px;display:grid;place-items:center"><img src="${A}status-icon.png" style="width:15px;height:15px;filter:invert(1)" alt=""></span></div>` },
      ],
      ring: 'statsItem',
    }),
    health: () => ({
      mb: {},
      copy: copy('Health alerts', 'Too hot?<br><span>You get a heads-up.</span>', 'When CPU or memory stays over your limit, QuitX warns you and offers to quit inactive apps. Never the app you’re using, never without asking.', ['CPU over 80%', 'Memory pressure']),
      ui: [
        { anchor: 'qx', html: QX.rescue({ title: 'High CPU usage', detail: 'System CPU stayed at 92% (limit 80%). QuitX wants to quit inactive apps. Your call.', targets: [{ n: 'Google Chrome', i: 'chrome', v: '48%' }, { n: 'Docker Desktop', v: '21%' }, { n: 'Visual Studio Code', i: 'vscode', v: '17%' }] }), zoom: 1.6 },
      ],
    }),
    sleep: () => ({
      mb: {},
      copy: copy('Quit on sleep', 'Wake up to<br><span>a clean slate.</span>', 'Quit open apps when your Mac goes to sleep, only between the hours you choose. Daytime naps leave everything as it was.', ['12 AM to 6 AM by default', '12 or 24-hour clock']),
      ui: [{ x: 680, y: 110, zoom: 1.1, html: QX.settings({ tab: 'Automation', content: QX.automation({ hl: 'sleep' }) }) }],
    }),
    theme: () => ({
      mb: {},
      copy: copy('Classic or Liquid Glass', 'Your Mac,<br><span>your look.</span>', 'Pick the solid classic look or translucent Liquid Glass on macOS 26. Every window and menu follows along.', ['Classic', 'Liquid Glass']),
      ui: [
        { x: 720, y: 150, html: QX.popover({ apps: most.slice(0, 9), hover: 'Music' }), zoom: 1.25, label: 'Classic' },
        { x: 1075, y: 150, html: QX.popover({ apps: most.slice(0, 9), hover: 'Music', glass: true }), zoom: 1.25, label: 'Liquid Glass' },
      ],
    }),
    sounds: () => ({
      mb: {},
      copy: copy('Sounds', 'Pew pew.<br><span>Gone.</span>', 'A short arcade laser plays every time you vaporize an app. Love it or switch it off in Settings.', ['Play cool sounds', 'On by default']),
      ui: [{ x: 680, y: 110, zoom: 1.1, html: QX.settings({ tab: 'General', content: QX.general({ hl: 'sounds' }) }) }, { x: 950, y: 650, html: `<div class="wave">${[18, 34, 56, 74, 48, 66, 40, 58, 30, 46, 24, 36, 16, 26, 12].map(h => `<i style="height:${h}px"></i>`).join('')}</div>` }],
    }),
    updates: () => ({
      mb: { dot: true },
      copy: copy('In-app updates', 'Updates itself,<br><span>straight from GitHub.</span>', 'A red dot tells you a new version shipped. QuitX downloads it from GitHub Releases, checks the checksum and code signature, then swaps itself in place.', ['No update server', 'Signature verified', 'Settings carry over']),
      ui: [
        { anchor: 'qx', menu: true, html: QX.menu([{ t: 'Restart to Update to v1.1.9', dot: true, on: true }, '-', { t: 'Settings', icon: 'settings', k: '⌘,' }, { t: 'Help', icon: 'help', k: '⌘?' }, { t: "What's New", icon: 'sparkles', k: '⌘N' }, { t: 'Check for Updates', icon: 'refresh', k: '⌘U' }, { t: 'About', icon: 'info', k: '⌘I' }, '-', { t: 'Quit', icon: 'quit', k: '⌘Q' }]), zoom: 1.15 },
        { x: 770, y: 300, html: `<div class="qx-win" style="width:412px;padding:0 22px 18px;background:#2A292C"><div style="height:34px;display:flex;align-items:center;justify-content:center;position:relative;font-size:13px;font-weight:600;color:rgba(255,255,255,.88)"><span class="lights" style="position:absolute;left:-8px"><i style="background:#FF5F57"></i><i style="background:#58565A"></i><i style="background:#58565A"></i></span>Update</div><div style="display:flex;align-items:flex-start;gap:16px;margin-top:10px"><div style="position:relative;flex:none"><img src="${A}icon.png" style="width:64px;height:64px;display:block" alt=""><span style="position:absolute;right:3px;bottom:3px;width:22px;height:22px;border-radius:50%;background:#30D158;display:grid;place-items:center;box-shadow:0 0 0 2px #2A292C"><svg width="12" height="12" viewBox="0 0 12 12"><path d="M2.4 6.3l2.3 2.3L9.8 3.4" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span></div><div><div style="margin:2px 0 6px;font-size:15px;font-weight:700">Ready to Install v1.1.9</div><div style="font-size:12.5px;color:rgba(255,255,255,.8);line-height:1.45">The latest version has been downloaded and verified.</div><div style="font-size:12px;color:rgba(255,255,255,.52);margin-top:4px">QuitX will restart to finish installing the update.</div></div></div><div style="display:flex;justify-content:flex-end;gap:8px;margin-top:20px"><span style="height:30px;padding:0 15px;border-radius:7px;display:inline-flex;align-items:center;font-size:13px;font-weight:500;background:rgba(255,255,255,.1)">Later</span><span style="height:30px;padding:0 15px;border-radius:7px;display:inline-flex;align-items:center;font-size:13px;font-weight:600;background:#FEBC33;color:rgba(0,0,0,.88)">Restart &amp; Update</span></div></div>` },
      ],
    }),
    ports: () => ({
      mb: { stats: { ports: 6, cpu: '12%', mem: '9.4 GB' } },
      copy: copy('Port killing', 'Port in use?<br><span>Free it in a click.</span>', 'Turn on Ports in Settings and every listening port shows up next to your apps: dev servers, databases and Docker containers. Kill one, some, or all, with the process tree behind it.', ['Live refresh', 'Docker aware', 'SIGTERM, then SIGKILL']),
      ui: [
        { anchor: 'qx', w: 330, html: QX.ports({ selected: [3000, 5173], hover: 3000 }), zoom: 1.6 },
      ],
      ring: 'statsItem',
    }),
    portsSettings: () => ({
      mb: { stats: { ports: 6, cpu: '12%', mem: '9.4 GB' } },
      copy: copy('Ports settings', 'Off until<br><span>you want it.</span>', 'Port killing stays off until you switch it on. Then pick how often the list refreshes, show the port count in the menu bar, and exclude ports that must never be touched.', ['Off by default', 'Exclude ports', 'Confirm before kill']),
      ui: [{ x: 680, y: 110, zoom: 1.1, html: QX.settings({ tab: 'Ports', content: QX.portSettings({ hl: 'enable' }) }) }],
      ring: 'statsItem',
    }),
  };

  const hash = (location.hash || '#hero').slice(1);
  const bare = hash.endsWith('-bare');
  const id = hash.replace('-bare', '');
  const sc = SCENES[id]();
  const root = document.getElementById('root');
  root.innerHTML = `<div class="wall"></div>${mb(sc.mb)}${bare ? '' : sc.copy}`;
  const qx = document.getElementById('qx');
  const qr = qx.getBoundingClientRect();
  const cx = qr.left + qr.width / 2;
  for (const u of sc.ui) {
    const el = document.createElement('div');
    el.className = 'ui';
    el.innerHTML = u.html;
    if (u.zoom) el.style.zoom = u.zoom;
    root.appendChild(el);
    const z = u.zoom || 1;
    if (u.anchor === 'qx' && !u.menu) {
      qx.classList.add('active');
      const pw = u.w || 270;
      const left = Math.min(cx - (pw / 2) * z, 1440 - pw * z - 8);
      const arrow = el.querySelector('.arrow');
      if (arrow) arrow.style.left = ((cx - left) / z) + 'px';
      el.style.left = (left / z) + 'px';
      el.style.top = (qr.bottom + 1) / z + 'px';
    } else if (u.anchor === 'qx' && u.menu) {
      qx.classList.add('active');
      el.style.left = Math.min(qr.left - 4, 1440 - 250 * z - 10) / z + 'px';
      el.style.top = (qr.bottom + 4) / z + 'px';
    } else if (u.below === 'gear') {
      const g = document.querySelector('[data-role="gear"]').getBoundingClientRect();
      el.style.left = (g.left - 8) / z + 'px';
      el.style.top = (g.bottom + 4) / z + 'px';
      if ((g.left - 8) + 236 * z > 1430) el.style.left = (1430 - 236 * z) / z + 'px';
    } else if (u.besidePort) {
      const rr = document.querySelector(`[data-port="${u.besidePort}"] .more`).getBoundingClientRect();
      el.querySelector('.qx-menu').style.width = (u.w || 236) + 'px';
      const w = (u.w || 236) * z;
      el.style.left = (rr.left - w - 6) / z + 'px';
      el.style.top = (rr.top - 4) / z + 'px';
    } else if (u.beside) {
      const rr = document.querySelector(`[data-app="${u.beside}"] .more`).getBoundingClientRect();
      const w = 236 * z;
      let left = rr.left - w - 6;
      el.style.left = left / z + 'px';
      el.style.top = (rr.top - 4) / z + 'px';
    } else {
      el.style.left = u.x / z + 'px';
      el.style.top = u.y / z + 'px';
    }
    if (u.label && !bare) {
      const r = el.getBoundingClientRect();
      root.insertAdjacentHTML('beforeend', `<div class="label" style="left:${r.left}px;top:${r.top - 26}px">${u.label}</div>`);
    }
  }
  if (sc.ring) document.getElementById(sc.ring).firstElementChild.classList.add('active');
  const FOCUS = {
    force: ['[data-role="quit"]', '[data-app="Maps"]'],
    confirm: ['.qx-confirm'],
    background: ['[data-app="Docker Desktop"]', '.qx-menu'],
    exclude: ['.qx-menu', '[data-app="Music"] .pw'],
    hero: ['[data-role="quit"]', '[data-app="Messages"]'],
    ports: ['.qx-pop'],
  };
  window.FOCUS_RECT = (() => {
    const sels = FOCUS[id];
    if (!sels) return null;
    let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
    sels.forEach(sel => document.querySelectorAll(sel).forEach(el => {
      const r = el.getBoundingClientRect();
      x0 = Math.min(x0, r.left); y0 = Math.min(y0, r.top); x1 = Math.max(x1, r.right); y1 = Math.max(y1, r.bottom);
    }));
    return { x0, y0, x1, y1 };
  })();
  window.UI_RECT = (() => {
    let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
    document.querySelectorAll('.ui').forEach(el => {
      const r = el.getBoundingClientRect();
      x0 = Math.min(x0, r.left); y0 = Math.min(y0, r.top); x1 = Math.max(x1, r.right); y1 = Math.max(y1, r.bottom);
    });
    return { x0, y0, x1, y1 };
  })();
  window.SHOT_READY = true;
</script>
</body>
</html>
