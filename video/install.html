<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>QuitX install steps</title>
<link rel="stylesheet" href="kit.css">
<style>
  :root { --gold: #FEBC33; --blue: #0A63D8; --ink: #F5F2EC; }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1200px; height: 750px; overflow: hidden; background: #0B0A09; }
  body { font-family: "Inter", -apple-system, system-ui, sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; }
  .scene { position: absolute; inset: 0; overflow: hidden; }
  .wall { position: absolute; inset: 0;
    background:
      radial-gradient(60% 75% at 82% 8%, rgba(254, 188, 51, .5), transparent 62%),
      radial-gradient(55% 65% at 100% 100%, rgba(214, 92, 26, .5), transparent 60%),
      radial-gradient(70% 80% at 0% 100%, rgba(70, 38, 14, .9), transparent 65%),
      linear-gradient(160deg, #1A1511 0%, #120F0C 45%, #24160C 100%); }
  .menubar { position: absolute; left: 0; right: 0; top: 0; height: 26px; z-index: 5; display: flex; align-items: center; gap: 18px; padding: 0 16px;
    background: rgba(18, 14, 10, .38); backdrop-filter: blur(30px); font-size: 12.5px; font-weight: 500; color: rgba(255,255,255,.92); }
  .menubar b { font-weight: 700; }
  .menubar .right { margin-left: auto; display: flex; align-items: center; gap: 14px; }
  .qx { position: relative; width: 26px; height: 20px; border-radius: 5px; display: grid; place-items: center; }
  .qx.active { background: rgba(255,255,255,.22); }
  .qx img { width: 16px; height: 16px; filter: invert(1); }

  .win { position: absolute; border-radius: 12px; overflow: hidden; background: #262527; color: #ECEAE6;
    box-shadow: 0 0 0 .5px rgba(255,255,255,.14), 0 0 0 1px rgba(0,0,0,.6), 0 36px 72px rgba(0,0,0,.5), 0 6px 18px rgba(0,0,0,.3); }
  .lights { display: flex; gap: 8px; }
  .lights i { width: 12px; height: 12px; border-radius: 50%; display: block; box-shadow: inset 0 0 0 .5px rgba(0,0,0,.25); }
  .tb { height: 44px; display: flex; align-items: center; padding: 0 16px; background: #2D2C2F; border-bottom: 1px solid rgba(0,0,0,.45); position: relative; }
  .tb .t { position: absolute; left: 0; right: 0; text-align: center; font-size: 13px; font-weight: 600; color: rgba(255,255,255,.85); pointer-events: none; }

  .finder { left: 250px; top: 165px; width: 700px; height: 420px; }
  .finder .body { position: relative; height: 376px; background: radial-gradient(80% 90% at 50% 40%, #34312E, #232120); }
  .item { position: absolute; top: 108px; width: 160px; text-align: center; font-size: 14px; font-weight: 500; }
  .item img, .item svg { width: 128px; height: 128px; display: block; margin: 0 auto 10px; filter: drop-shadow(0 10px 18px rgba(0,0,0,.45)); }
  .arrowpath { position: absolute; left: 248px; top: 140px; }
  .ghost { position: absolute; width: 96px; height: 96px; opacity: .55; filter: drop-shadow(0 10px 14px rgba(0,0,0,.4)); }

  .alert { position: absolute; width: 272px; padding: 20px 18px 16px; border-radius: 14px; text-align: center; color: #fff;
    background: rgba(44, 41, 40, .92); backdrop-filter: blur(30px) saturate(1.5);
    box-shadow: 0 0 0 .5px rgba(255,255,255,.18), 0 0 0 1px rgba(0,0,0,.5), 0 30px 70px rgba(0,0,0,.55); }
  .alert .ic { position: relative; width: 64px; height: 64px; margin: 0 auto 12px; }
  .alert .ic img { width: 64px; height: 64px; }
  .alert .ic .warn { position: absolute; right: -6px; bottom: -4px; width: 30px; height: 30px; }
  .alert h4 { margin: 0 0 6px; font-size: 13.5px; font-weight: 700; line-height: 1.3; }
  .alert p { margin: 0 0 16px; font-size: 11.5px; line-height: 1.4; color: rgba(255,255,255,.82); }
  .alert .btn { height: 28px; border-radius: 7px; display: grid; place-items: center; font-size: 13px; font-weight: 500; background: rgba(255,255,255,.14); margin-top: 8px; }
  .alert .btn.primary { background: var(--blue); color: #fff; }
  .alert .help { position: absolute; left: 14px; bottom: 16px; width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 600; background: rgba(255,255,255,.12); }

  .settings { left: 120px; top: 46px; width: 960px; height: 590px; display: flex; }
  .settings .side { width: 240px; background: rgba(40, 38, 38, .96); border-right: 1px solid rgba(0,0,0,.4); padding: 14px 10px; }
  .settings .side .lights { margin: 2px 6px 18px; }
  .search { height: 28px; border-radius: 7px; background: rgba(255,255,255,.08); display: flex; align-items: center; gap: 6px; padding: 0 9px; color: rgba(255,255,255,.45); font-size: 13px; margin-bottom: 12px; }
  .si { display: flex; align-items: center; gap: 9px; height: 30px; padding: 0 8px; border-radius: 7px; font-size: 13px; color: rgba(255,255,255,.88); }
  .si i { width: 20px; height: 20px; border-radius: 5px; display: grid; place-items: center; flex: none; }
  .si i svg { width: 13px; height: 13px; fill: none; stroke: #fff; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .si.on { background: var(--blue); }
  .settings .pane { flex: 1; background: #1F1E20; display: flex; flex-direction: column; }
  .pane .ph { height: 52px; display: flex; align-items: center; gap: 14px; padding: 0 22px; font-size: 15px; font-weight: 700; border-bottom: 1px solid rgba(255,255,255,.06); }
  .pane .ph span { color: rgba(255,255,255,.4); font-size: 18px; font-weight: 400; }
  .pane .pc { padding: 18px 28px; overflow: hidden; }
  .grp { margin-bottom: 18px; }
  .grp h5 { margin: 0 0 8px 4px; font-size: 13px; font-weight: 700; color: rgba(255,255,255,.88); }
  .box { border-radius: 10px; background: rgba(255,255,255,.05); box-shadow: inset 0 0 0 .5px rgba(255,255,255,.08); }
  .rw { min-height: 42px; display: flex; align-items: center; gap: 12px; padding: 8px 14px; font-size: 13px; border-top: 1px solid rgba(255,255,255,.06); }
  .rw:first-child { border-top: 0; }
  .rw .r { margin-left: auto; color: rgba(255,255,255,.55); display: flex; align-items: center; gap: 6px; }
  .pill { height: 24px; padding: 0 12px; border-radius: 6px; display: inline-flex; align-items: center; font-size: 12.5px; font-weight: 500; background: rgba(255,255,255,.14); color: #fff; }
  .rw .muted { color: rgba(255,255,255,.55); }
  .chev { width: 8px; height: 8px; border-right: 1.6px solid rgba(255,255,255,.4); border-bottom: 1.6px solid rgba(255,255,255,.4); transform: rotate(-45deg); }

  .ring { position: absolute; border-radius: 10px; box-shadow: 0 0 0 3px var(--gold), 0 0 0 9px rgba(254,188,51,.22), 0 0 34px rgba(254,188,51,.45); pointer-events: none; z-index: 8; }
  .badge { position: absolute; z-index: 9; display: flex; align-items: center; gap: 10px; padding: 8px 14px 8px 8px; border-radius: 999px; background: rgba(14,12,10,.86);
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.14), 0 12px 28px rgba(0,0,0,.4); font-size: 15px; font-weight: 600; color: #fff; white-space: nowrap; backdrop-filter: blur(10px); }
  .badge b { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: var(--gold); color: #1A1205; font-size: 14px; }
  .cursor { position: absolute; width: 22px; height: 30px; z-index: 10; filter: drop-shadow(0 2px 3px rgba(0,0,0,.45)); }

  .term { left: 160px; top: 150px; width: 880px; height: 450px; background: #151413; }
  .term .tb { background: #262422; }
  .term pre { margin: 0; padding: 18px 20px; font: 13.5px/1.75 "JetBrains Mono", ui-monospace, monospace; color: #E8E2D8; white-space: pre-wrap; }
  .term .g { color: #FEBC33; font-weight: 700; } .term .d { color: rgba(232,226,216,.5); } .term .ok { color: #30D158; } .term .p { color: #8FD1FF; }
</style>
</head>
<body>
<script src="kit.js"></script>
<div id="root"></div>
<script>
  const A = '../site/assets/';
  const cursor = (x, y) => `<svg class="cursor" style="left:${x}px;top:${y}px" viewBox="0 0 22 30"><path d="M2 2v22l6-6 4 9 4-2-4-8.5h8.5z" fill="#000" stroke="#fff" stroke-width="1.8" stroke-linejoin="round"/></svg>`;
  const badge = (n, text, x, y) => `<div class="badge" style="left:${x}px;top:${y}px"><b>${n}</b>${text}</div>`;
  const menubar = (active) => `<div class="menubar"><b>Finder</b><span>File</span><span>Edit</span><span>View</span><span>Go</span><span>Window</span><span>Help</span><div class="right"><div class="qx${active ? ' active' : ''}" id="qx"><img src="${A}status-icon.png" alt=""></div><svg width="22" height="11" viewBox="0 0 22 12"><rect x="1" y="1.5" width="17" height="9" rx="2.6" fill="none" stroke="#fff" stroke-opacity=".9" stroke-width="1.1"/><rect x="2.8" y="3.3" width="11.4" height="5.4" rx="1.3" fill="#fff"/></svg><span>Fri Oct 23&nbsp;&nbsp;9:41 AM</span></div></div>`;
  const folder = `<svg viewBox="0 0 128 128"><defs><linearGradient id="fb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6EC1FF"/><stop offset="1" stop-color="#2F8CF0"/></linearGradient><linearGradient id="ff" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8FD0FF"/><stop offset="1" stop-color="#4AA3F7"/></linearGradient></defs><path d="M10 30a8 8 0 0 1 8-8h30l9 9h53a8 8 0 0 1 8 8v8H10z" fill="url(#fb)"/><rect x="10" y="40" width="108" height="72" rx="8" fill="url(#ff)"/><g fill="none" stroke="#1E6FD0" stroke-width="5" stroke-linecap="round" opacity=".55"><path d="M48 92l16-30 16 30M53 82h22"/></g></svg>`;
  const alertWarn = `<svg class="warn" viewBox="0 0 30 30"><path d="M15 3l13 23H2z" fill="#FFD60A" stroke="#2C2928" stroke-width="2" stroke-linejoin="round"/><path d="M15 11v8" stroke="#1A1205" stroke-width="2.6" stroke-linecap="round"/><circle cx="15" cy="22.5" r="1.6" fill="#1A1205"/></svg>`;
  const sideItem = (label, color, path, on) => `<div class="si${on ? ' on' : ''}"><i style="background:${color}"><svg viewBox="0 0 16 16">${path}</svg></i>${label}</div>`;

  const SCENES = {
    dmg: () => `<div class="wall"></div>${menubar()}
      <div class="win finder"><div class="tb"><span class="lights"><i style="background:#FF5F57"></i><i style="background:#FEBC2E"></i><i style="background:#28C840"></i></span><div class="t">QuitX</div></div>
        <div class="body">
          <div class="item" style="left:80px"><img src="${A}icon.png" alt="">QuitX</div>
          <svg class="arrowpath" width="200" height="80" viewBox="0 0 200 80"><path d="M10 50 C 70 0, 130 0, 185 45" fill="none" stroke="rgba(254,188,51,.9)" stroke-width="4" stroke-linecap="round" stroke-dasharray="2 12"/><path d="M172 30l16 17-22 4" fill="none" stroke="rgba(254,188,51,.9)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <div class="item" style="left:460px">${folder}Applications</div>
          <img class="ghost" src="${A}icon.png" style="left:420px;top:96px" alt="">
        </div></div>
      ${cursor(500, 238)}${badge(1, 'Drag QuitX into Applications', 418, 600)}`,

    blocked: () => `<div class="wall"></div>${menubar()}
      <div class="alert" id="al" style="zoom:1.45;left:217px;top:95px"><div class="ic"><img src="${A}icon.png" alt="">${alertWarn}</div>
        <h4>“QuitX” Not Opened</h4>
        <p>Apple could not verify “QuitX” is free of malware that may harm your Mac or compromise your privacy.</p>
        <div class="btn primary" id="done">Done</div><div class="btn">Move to Trash</div><span class="help" style="display:none">?</span></div>
      ${badge(2, 'First launch: click Done, not Move to Trash', 380, 650)}`,

    settings: () => `<div class="wall"></div>${menubar()}
      <div class="win settings">
        <div class="side"><span class="lights"><i style="background:#FF5F57"></i><i style="background:#FEBC2E"></i><i style="background:#28C840"></i></span>
          <div class="search"><svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="5" cy="5" r="3.6"/><path d="M7.8 7.8l2.8 2.8"/></svg>Search</div>
          ${sideItem('Wi-Fi', '#2F8CF0', '<path d="M2 6.5a8.5 8.5 0 0 1 12 0M4.3 8.8a5.3 5.3 0 0 1 7.4 0M8 12.2v.1"/>')}
          ${sideItem('Bluetooth', '#2F8CF0', '<path d="M5 5l6 6-3 2.5V2.5L11 5l-6 6"/>')}
          ${sideItem('Network', '#2F8CF0', '<circle cx="8" cy="8" r="5.5"/><path d="M2.5 8h11M8 2.5c2 2 2 9 0 11M8 2.5c-2 2-2 9 0 11"/>')}
          <div style="height:10px"></div>
          ${sideItem('General', '#8E8E93', '<circle cx="8" cy="8" r="2.2"/><path d="M8 2v2M8 12v2M2 8h2M12 8h2"/>')}
          ${sideItem('Appearance', '#3A3A3C', '<circle cx="8" cy="8" r="5.5"/><path d="M8 2.5v11" />')}
          ${sideItem('Control Center', '#8E8E93', '<rect x="2.5" y="3" width="11" height="4" rx="2"/><rect x="2.5" y="9" width="11" height="4" rx="2"/>')}
          ${sideItem('Desktop &amp; Dock', '#3A3A3C', '<rect x="2" y="3" width="12" height="9" rx="1.5"/><path d="M5 14h6"/>')}
          ${sideItem('Displays', '#2F8CF0', '<rect x="2" y="3" width="12" height="8" rx="1.2"/><path d="M6 14h4"/>')}
          <div style="height:10px"></div>
          ${sideItem('Notifications', '#FF453A', '<path d="M4 11V7a4 4 0 0 1 8 0v4l1 1H3zM7 14h2"/>')}
          ${sideItem('Focus', '#5E5CE6', '<path d="M12.5 9.5A5 5 0 1 1 6.5 3.5a4 4 0 0 0 6 6z"/>')}
          ${sideItem('Privacy &amp; Security', '#2F8CF0', '<path d="M8 2l5 2v4c0 3.2-2.3 5.4-5 6-2.7-.6-5-2.8-5-6V4z"/>', true)}
          ${sideItem('Touch ID &amp; Password', '#FF453A', '<circle cx="8" cy="8" r="5.5"/><path d="M5.5 8a2.5 2.5 0 0 1 5 0v1.5"/>')}
        </div>
        <div class="pane"><div class="ph"><span>‹</span><span>›</span>Privacy &amp; Security</div>
          <div class="pc">
            <div class="grp"><div class="box">
              <div class="rw">Location Services<span class="r">On<i class="chev"></i></span></div>
              <div class="rw">Accessibility<span class="r"><i class="chev"></i></span></div>
              <div class="rw">Full Disk Access<span class="r"><i class="chev"></i></span></div>
            </div></div>
            <div class="grp"><h5>Security</h5><div class="box">
              <div class="rw">Allow applications from<span class="r"><span class="pill" style="background:rgba(255,255,255,.1);color:rgba(255,255,255,.85)">App Store &amp; Known Developers&nbsp;⌄</span></span></div>
              <div class="rw" style="min-height:58px"><span>“QuitX” was blocked to protect your Mac.</span><span class="r"><span class="pill" id="openAnyway">Open Anyway</span></span></div>
            </div></div>
            <div class="grp"><div class="box">
              <div class="rw">FileVault<span class="r">On<i class="chev"></i></span></div>
              <div class="rw">Lockdown Mode<span class="r">Off<i class="chev"></i></span></div>
            </div></div>
          </div>
        </div>
      </div>
      ${badge(3, 'System Settings › Privacy &amp; Security › Open Anyway', 340, 664)}`,

    confirm: () => `<div class="wall"></div>${menubar()}
      <div class="alert" style="zoom:1.45;left:217px;top:72px"><div class="ic"><img src="${A}icon.png" alt="">${alertWarn}</div>
        <h4>Open “QuitX”?</h4>
        <p>Apple is not able to verify that it is free from malware that could harm your Mac or compromise your privacy. Don’t open this unless you are certain it is from a trustworthy source.</p>
        <div class="btn" id="openA">Open Anyway</div><div class="btn">Move to Trash</div></div>
      ${badge(4, 'Click Open Anyway, then enter your password or use Touch ID', 300, 660)}`,

    ready: () => {
      const pop = QX.popover({ apps: QX.APPS.slice(0, 9), hover: 'Music' });
      return `<div class="wall"></div>${menubar(true)}<div id="popwrap" style="position:absolute;zoom:1.35">${pop}</div>${badge(5, 'Done. QuitX lives in your menu bar', 60, 600)}`;
    },

    strip: () => `<div class="wall" style="opacity:.6"></div><div style="position:absolute;inset:24px;display:grid;grid-template-columns:1fr 1fr;gap:20px">${[['dmg', 'Drag QuitX into Applications'], ['blocked', 'First launch: click Done'], ['settings', 'Privacy &amp; Security › Open Anyway'], ['confirm', 'Open Anyway, then your password']].map(([k, t], i) => `<div style="position:relative;border-radius:14px;overflow:hidden;box-shadow:0 0 0 1px rgba(255,255,255,.12),0 16px 40px rgba(0,0,0,.45)"><iframe src="install.html#${k}-bare" style="width:1200px;height:750px;border:0;transform:scale(.4667);transform-origin:0 0;display:block" scrolling="no"></iframe><div class="badge" style="left:12px;bottom:12px;font-size:14px"><b>${i + 1}</b>${t}</div></div>`).join('')}</div>`,

    terminal: () => `<div class="wall"></div>${menubar()}
      <div class="win term"><div class="tb"><span class="lights"><i style="background:#FF5F57"></i><i style="background:#FEBC2E"></i><i style="background:#28C840"></i></span><div class="t">Terminal</div></div>
<pre><span class="p">~</span> curl -fsSL https://quitx.kiron.dev/install | bash
<span class="g">==></span> <b>Finding the latest QuitX release</b>
    <span class="d">QuitX 1.1.9</span>
<span class="g">==></span> <b>Downloading</b>
<span class="d">######################################################################## 100.0%</span>
<span class="g">==></span> <b>Verifying checksum</b>
    <span class="d">SHA-256 matches GitHub (0e358a884c81bd1eb7f0ba654ea0193e4289e425…)</span>
<span class="g">==></span> <b>Checking the app</b>
    <span class="d">Code signature valid, version 1.1.9</span>
<span class="g">==></span> <b>Installing in /Applications</b>
<span class="g">==></span> <b>Opening QuitX</b>

<span class="ok">QuitX 1.1.9 is installed.</span> Look for its icon in the menu bar.
<span class="d">It updates itself from GitHub. Settings are in its menu.</span></pre></div>`,
  };

  const hash = (location.hash || '#dmg').slice(1);
  const bare = hash.endsWith('-bare');
  const id = hash.replace('-bare', '');
  document.getElementById('root').innerHTML = `<div class="scene">${SCENES[id]()}</div>`;

  const ring = (el, pad = 6) => {
    const r = el.getBoundingClientRect();
    document.querySelector('.scene').insertAdjacentHTML('beforeend', `<div class="ring" style="left:${r.left - pad}px;top:${r.top - pad}px;width:${r.width + pad * 2}px;height:${r.height + pad * 2}px"></div>`);
    return r;
  };
  if (id === 'blocked') { const r = ring(document.getElementById('done'), 4); document.querySelector('.scene').insertAdjacentHTML('beforeend', cursor(r.left + r.width * .62, r.top + r.height * .55)); }
  if (id === 'settings') { const r = ring(document.getElementById('openAnyway'), 5); document.querySelector('.scene').insertAdjacentHTML('beforeend', cursor(r.left + r.width * .6, r.top + r.height * .6)); }
  if (id === 'confirm') { const r = ring(document.getElementById('openA'), 4); document.querySelector('.scene').insertAdjacentHTML('beforeend', cursor(r.left + r.width * .62, r.top + r.height * .55)); }
  if (id === 'ready') {
    const qr = document.getElementById('qx').getBoundingClientRect();
    const z = 1.35, cx = qr.left + qr.width / 2;
    const left = Math.min(cx - 135 * z, 1200 - 270 * z - 8);
    const w = document.getElementById('popwrap');
    w.style.left = left / z + 'px';
    w.style.top = (qr.bottom + 1) / z + 'px';
    const arrow = w.querySelector('.arrow');
    if (arrow) arrow.style.left = ((cx - left) / z) + 'px';
  }
  if (bare) document.querySelectorAll('.badge').forEach(b => b.remove());
  window.SHOT_READY = true;
</script>
</body>
</html>
